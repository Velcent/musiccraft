name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libjack-jackd2-dev xvfb
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Under Xvfb so the plugin editor test opens a real window.
      - run: xvfb-run -a cargo test --workspace --locked
      - name: Plugin bundles
        run: cargo xtask bundle
      # clap-validator (MIT) and the VST3 SDK's validator (GPLv3 option),
      # pinned; built once and cached (docs/spec/validation.md).
      - name: Cache the plugin validators
        uses: actions/cache@v4
        with:
          path: ~/validators
          key: validators-${{ runner.os }}-clap-b2f1d9b-vst3sdk-v3.8.1_build_84
      - name: Build the plugin validators
        run: |
          mkdir -p ~/validators
          if [ ! -x ~/validators/clap-validator ]; then
            cargo install --locked --root ~/validators/clap \
              --git https://github.com/free-audio/clap-validator \
              --rev b2f1d9b79b1d264a5747f46707d72b1aa40a02ef clap-validator
            cp ~/validators/clap/bin/clap-validator ~/validators/
          fi
          if [ ! -x ~/validators/validator ]; then
            git clone -q --depth 1 --branch v3.8.1_build_84 \
              https://github.com/steinbergmedia/vst3sdk "$RUNNER_TEMP/vst3sdk"
            git -C "$RUNNER_TEMP/vst3sdk" submodule update -q --init --depth 1 \
              base pluginterfaces public.sdk cmake
            cmake -S "$RUNNER_TEMP/vst3sdk" -B "$RUNNER_TEMP/vst3sdk/build" \
              -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
              -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
              -DSMTG_RUN_VST_VALIDATOR=OFF
            cmake --build "$RUNNER_TEMP/vst3sdk/build" --target validator -j 4
            cp "$RUNNER_TEMP/vst3sdk/build/bin/Release/validator" ~/validators/
          fi
      - name: Validate the plugin bundles
        run: |
          CLAP_VALIDATOR=~/validators/clap-validator \
          VST3_VALIDATOR=~/validators/validator \
          cargo xtask validate
      - name: Plugin CPU benchmark
        run: cargo run --release --locked -p musiccraft-plugin-export --example bench
      - name: Standalone apps (own workspace)
        run: |
          cargo fmt --manifest-path standalone/Cargo.toml -- --check
          cargo clippy --manifest-path standalone/Cargo.toml --locked -- -D warnings
      - name: Antiserum real-time benchmark
        run: cargo run --release --locked -p musiccraft-antiserum --example bench

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
