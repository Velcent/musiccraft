# Temporary: surfaces build and test errors as annotations. Removed before merge.
name: diag
on: pull_request
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | grep -E '(error|warning)' | grep -v '^warning: build failed' | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          cargo test --workspace --locked --no-fail-fast 2>&1 | grep -E "panicked|FAILED|^error|left:|right:" | head -40 | while IFS= read -r l; do echo "::warning::$l"; done
          echo "::warning::diag done"
