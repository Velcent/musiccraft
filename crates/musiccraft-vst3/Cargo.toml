[package]
name = "musiccraft-vst3"
description = "MusicCraft VST3 plugin host (allowed to use unsafe, like the CLAP host)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vst3 = "0.3"
libloading = "0.8"
musiccraft-engine.workspace = true
musiccraft-render.workspace = true
rtrb.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
musiccraft-plugin-window.workspace = true

[dev-dependencies]
musiccraft-vst3-testplugin = { path = "../musiccraft-vst3-testplugin" }
musiccraft-commands.workspace = true
musiccraft-project.workspace = true

# Not `workspace = true`: this crate is exempt from the workspace `unsafe` ban
# (see ARCHITECTURE.md). Every other lint matches the workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
