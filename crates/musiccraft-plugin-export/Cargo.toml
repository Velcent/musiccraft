[package]
name = "musiccraft-plugin-export"
description = "MusicCraft's effects as CLAP and VST3 plugins and standalone apps (nih-plug)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# `cdylib` is the plugin library; `lib` serves the standalone app and tests.
crate-type = ["cdylib", "lib"]

[features]
default = ["effects", "instruments"]
# Which plugins the library exports; `cargo xtask bundle` builds one bundle
# per feature (MusicCraft Effects, MusicCraft Instruments).
effects = []
instruments = []

[dependencies]
egui.workspace = true
musiccraft-antiserum.workspace = true
musiccraft-antiserum-presets.workspace = true
musiccraft-dsp.workspace = true
musiccraft-editors.workspace = true
musiccraft-instruments.workspace = true
musiccraft-params.workspace = true
musiccraft-patch.workspace = true
musiccraft-plugin-editor.workspace = true
nih_plug = { workspace = true, features = ["vst3"] }
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
musiccraft-clap.workspace = true
musiccraft-engine.workspace = true
musiccraft-render.workspace = true
musiccraft-vst3.workspace = true
nih_plug = { workspace = true, features = ["vst3", "assert_process_allocs"] }

# Not `workspace = true`: this crate is exempt from the workspace `unsafe` ban
# (see ARCHITECTURE.md). Every other lint matches the workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
