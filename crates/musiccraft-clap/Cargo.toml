[package]
name = "musiccraft-clap"
description = "MusicCraft CLAP plugin host (the one crate allowed to use unsafe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap-sys = "0.5"
libloading = "0.8"
musiccraft-engine.workspace = true
musiccraft-render.workspace = true
rtrb.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
musiccraft-plugin-window.workspace = true

[dev-dependencies]
musiccraft-clap-testplugin = { path = "../musiccraft-clap-testplugin" }
musiccraft-commands.workspace = true
musiccraft-project.workspace = true

# Not `workspace = true`: this crate is exempt from the workspace `unsafe` ban
# (see ARCHITECTURE.md). Every other lint matches the workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"
